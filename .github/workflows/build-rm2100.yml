name: Build Padavan RM2100

on:
  workflow_dispatch:

  push:
    paths:
      - "trunk/configs/templates/RM2100.config"
      - ".github/workflows/build-rm2100.yml"
      - "trunk/**"

permissions:
  contents: read

jobs:
  build:
    name: Build RM2100
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            unzip \
            libtool-bin \
            curl \
            cmake \
            gperf \
            gawk \
            flex \
            bison \
            nano \
            xxd \
            fakeroot \
            kmod \
            cpio \
            git \
            python3-docutils \
            gettext \
            automake \
            autopoint \
            texinfo \
            build-essential \
            help2man \
            pkg-config \
            zlib1g-dev \
            libgmp3-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libltdl-dev \
            wget \
            libc-dev-bin

      # ============================================================
      # Download Padavan MIPS toolchain
      # ============================================================
      - name: Download MIPS toolchain
        shell: bash
        run: |
          set -e

          cd toolchain-mipsel

          echo "Downloading Padavan MIPS toolchain..."
          sh dl_toolchain.sh

          echo "Toolchain directory:"
          find . -maxdepth 3 -type f | head -50

      # ============================================================
      # Build RM2100
      # ============================================================
      - name: Build RM2100 firmware
        shell: bash
        run: |
          set -e

          cd trunk

          echo "========================================"
          echo " Building Padavan RM2100"
          echo "========================================"

          echo "Git commit:"
          git -C .. rev-parse --short HEAD

          echo "Kernel:"
          grep '^CONFIG_LINUXDIR=' configs/templates/RM2100.config || true

          echo "Product:"
          grep '^CONFIG_FIRMWARE_PRODUCT_ID=' configs/templates/RM2100.config || true

          echo "========================================"
          echo " Cleaning old build tree"
          echo "========================================"

          ./clear_tree || true

          echo "========================================"
          echo " Starting firmware build"
          echo "========================================"

          fakeroot ./build_firmware_modify RM2100

          echo "========================================"
          echo " Build finished"
          echo "========================================"

          ls -lah images/

      # ============================================================
      # Prepare artifact
      # ============================================================
      - name: Prepare firmware artifact
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp -av trunk/images/*.trx output/

          echo "========================================"
          echo " Firmware files"
          echo "========================================"

          ls -lah output/

          echo "========================================"
          echo " MD5"
          echo "========================================"

          cd output
          md5sum *.trx | tee md5sum.txt

      # ============================================================
      # Upload firmware
      # ============================================================
      - name: Upload RM2100 firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-RM2100
          path: output/
          if-no-files-found: error
          retention-days: 30
